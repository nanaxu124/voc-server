<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intent Details</title><script src="./dashboard_state.js"></script><link rel="stylesheet" href="./template.css"></head><body><div class="app-container"><div class="header-bar"><h1 class="header-title">iPhone Intent details</h1><div id="data-timestamp" class="header-meta">Data loading...</div></div><div class="top-control-row"><div class="card product-card-container"><div class="phone-art"></div></div><div class="card sec-control-panel"><div class="timeline"><div class="timeline-track"></div><div class="timeline-nodes"><div class="timeline-node"><strong>Announcement</strong>9/10</div><div class="timeline-node"><strong>Pre-order</strong>9/12</div><div class="timeline-node"><strong>On shelf</strong>9/19</div></div></div><div class="filter-grid"><div class="filter-item"><span class="filter-label">NPI</span><button class="filter-btn" id="npiDisplay" disabled>iPhone 17 Series</button></div><div class="filter-item"><span class="filter-label">Inquiry</span><select id="inqFilter"><option value="">All</option></select></div><div class="filter-item"><span class="filter-label">FW</span><select id="fw"><option value="">All</option><option>FY25Q4W11</option></select></div><div class="filter-item"><span class="filter-label">Date</span><select id="date"><option value="">All</option><option value="2025-09-10,2025-09-12">9/10～9/12</option></select></div></div></div></div><div class="intent-layout"><div class="card intent-table-card"><div class="table-head"><div><span class="badge">Intent Details</span><strong id="summary" style="margin-left:10px">--</strong></div><span class="muted">点击一行查看原声问题</span></div><div class="table-scroll"><table class="intent-table"><thead><tr><th>Inquiry</th><th>Sub</th><th>Third</th><th>Intent</th><th>Inquiries</th><th>CVR</th></tr></thead><tbody id="intentBody"></tbody></table></div></div><div class="card inquiry-card"><div class="table-head"><div><strong>Inquiry Details</strong><div id="selectedNode" class="muted" style="margin-top:5px">选择左侧意图</div></div><span class="badge">Top questions</span></div><div id="questions" class="question-list"><div class="question muted">暂无选择</div></div></div></div></div><script>
let allRows=[];
const state=VOCDashboardState.read();
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initFilters(){npiDisplay.textContent=state.product||'iPhone 17 Series';VOCDashboardState.ensureOption(fw,state.fw,state.fw);if(state.date_from||state.date_to){const value=(state.date_from||'')+','+(state.date_to||'');VOCDashboardState.ensureOption(date,value,[state.date_from,state.date_to].filter(Boolean).join(' ～ '));}}
function filterPatch(){const patch={fw:fw.value||'',date_from:'',date_to:''};if(date.value){const p=date.value.split(',');patch.date_from=p[0]||'';patch.date_to=p[1]||p[0]||'';}return patch;}
function cvr(r){return r.sessionCount>0?(r.sessionOrderCount/r.sessionCount*100):0}
function render(){const f=inqFilter.value;const rows=f?allRows.filter(x=>x.firstIntention===f):allRows;intentBody.innerHTML=rows.map(r=>`<tr data-i="${allRows.indexOf(r)}"><td>${esc(r.firstIntention)}</td><td>${esc(r.twoIntention)}</td><td>${esc(r.threeIntention)}</td><td>${esc(r.fourIntention)}</td><td>${Number(r.inquiries||0).toLocaleString()}</td><td>${cvr(r).toFixed(1)}%</td></tr>`).join('');intentBody.querySelectorAll('tr').forEach(tr=>tr.onclick=()=>show(allRows[Number(tr.dataset.i)]))}
function show(r){selectedNode.textContent=[r.firstIntention,r.twoIntention,r.threeIntention,r.fourIntention].filter(Boolean).join(' › ');const q=(r.inquirieList||[]).slice(0,50);questions.innerHTML=q.length?q.map((x,i)=>`<div class="question"><strong style="color:#0071e3">#${i+1}</strong> ${esc(x.inquiryName)} <span class="muted">(${Number(x.inquiryCount||0).toLocaleString()})</span></div>`).join(''):'<div class="question muted">暂无原声问题</div>'}
async function load(){try{const patch=filterPatch();const q=new URLSearchParams();if(patch.fw)q.set('fw',patch.fw);if(patch.date_from)q.set('date_from',patch.date_from);if(patch.date_to)q.set('date_to',patch.date_to);const r=await fetch('/api/mcp/intent_data?'+q);const j=await r.json();if(!r.ok||!j.success||!j.data?.length)throw new Error(j.error||'request failed');const rec=j.data[0],block=rec.intentDetailList?.[0]||{};allRows=block.intentList||[];const old=inqFilter.value;const groups=[...new Set(allRows.map(x=>x.firstIntention).filter(Boolean))].sort();inqFilter.innerHTML='<option value="">All</option>'+groups.map(x=>`<option>${esc(x)}</option>`).join('');if(groups.includes(old))inqFilter.value=old;const total=allRows.reduce((s,x)=>s+Number(x.inquiries||0),0);summary.textContent=total.toLocaleString()+' inquiries';const meta='Data as of '+(patch.date_to?patch.date_to.replace(/-/g,'/'):String(rec.date||'VOC MCP').replace(/-/g,'/'));document.getElementById('data-timestamp').textContent=meta;VOCDashboardState.notifyMeta(meta);render();if(allRows[0])show(allRows[0])}catch(e){const meta='VOC MCP error: '+e.message;document.getElementById('data-timestamp').textContent=meta;VOCDashboardState.notifyMeta(meta)}}
inqFilter.onchange=render;fw.onchange=()=>{VOCDashboardState.notify(filterPatch());load()};date.onchange=()=>{VOCDashboardState.notify(filterPatch());load()};initFilters();load();
</script></body></html>
