<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Price Related Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="./template.css"></head><body><div class="app-container"><div class="header-bar"><h1 class="header-title">iPhone Price related Dashboard</h1><div id="data-timestamp" class="header-meta">Data loading...</div></div><div class="top-control-row"><div class="card product-card-container"><div class="phone-art"></div></div><div class="card sec-control-panel"><div class="timeline"><div class="timeline-track"></div><div class="timeline-nodes"><div class="timeline-node"><strong>Announcement</strong>9/10</div><div class="timeline-node"><strong>Pre-order</strong>9/12</div><div class="timeline-node"><strong>On shelf</strong>9/19</div></div></div><div class="filter-grid two"><div class="filter-item"><span class="filter-label">NPI</span><select id="npiFilter"><option value="">iPhone 17 Series</option><option>iPhone 17</option><option>iPhone 17 Pro</option><option>iPhone 17 Pro Max</option><option>iPhone Air</option></select></div><div class="filter-item"><span class="filter-label">N-1</span><select id="n1Filter"><option value="">iPhone 16 Series</option><option>iPhone 16</option><option>iPhone 16 Plus</option><option>iPhone 16 Pro</option><option>iPhone 16 Pro Max</option></select></div></div></div></div><div class="card section-card"><div class="header-bar"><div><h2 class="section-title" style="margin-bottom:4px">Worries on Price Drop and Price Protection</h2><div class="muted">价格相关咨询占 Customer 比例</div></div><div class="price-summary"><div class="pill">NPI <strong id="avg-npi-price-rate" style="color:#0071e3">--</strong></div><div class="pill">N-1 <strong id="avg-n1-price-rate" style="color:#af52de">--</strong></div></div></div><div class="chart-box" style="height:480px;margin-top:18px"><canvas id="priceTrendChart"></canvas></div></div></div><script>let priceChart;function avg(arr){return arr.length?arr.reduce((a,b)=>a+Number(b||0),0)/arr.length:0}async function load(){try{const r=await fetch('/api/mcp/price_data');const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'request failed');const d=j.data||{},daily=d.daily||[],s=d.summary||{};const npiRate=Number.isFinite(Number(s.avg_ratio_pct))?Number(s.avg_ratio_pct):avg(daily.map(x=>x.npi_ratio_pct));const n1Rate=Number.isFinite(Number(s.n1_avg_ratio_pct))?Number(s.n1_avg_ratio_pct):avg(daily.map(x=>x.n1_ratio_pct));document.getElementById('avg-npi-price-rate').textContent=npiRate.toFixed(1)+'%';document.getElementById('avg-n1-price-rate').textContent=n1Rate.toFixed(1)+'%';const labels=daily.map(x=>{const p=String(x.date||'').split('-');return p.length===3?`${Number(p[1])}/${Number(p[2])}`:x.date});priceChart?.destroy();priceChart=new Chart(document.getElementById('priceTrendChart'),{type:'bar',data:{labels,datasets:[{label:'NPI',data:daily.map(x=>Number(x.npi_ratio_pct||0)),backgroundColor:'#0071e3',hoverBackgroundColor:'#0077ed',borderRadius:6,barPercentage:.45,categoryPercentage:.65},{label:'N-1',data:daily.map(x=>Number(x.n1_ratio_pct||0)),backgroundColor:'#af52de',hoverBackgroundColor:'#b865e2',borderRadius:6,barPercentage:.45,categoryPercentage:.65}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end',labels:{usePointStyle:true,pointStyle:'rectRounded'}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${Number(ctx.raw||0).toFixed(2)}%`}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>v+'%'},grid:{color:'rgba(0,0,0,.05)'}}}}});const last=daily.at(-1)?.date;document.getElementById('data-timestamp').textContent=last?'Data as of '+last.replace(/-/g,'/'):'VOC MCP · live'}catch(e){document.getElementById('data-timestamp').textContent='VOC MCP error: '+e.message}}npiFilter.onchange=load;n1Filter.onchange=load;load();</script></body></html>
