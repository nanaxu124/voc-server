<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Price Related Dashboard</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="./dashboard_state.js"></script><link rel="stylesheet" href="./template.css"></head><body><div class="app-container"><div class="header-bar"><h1 class="header-title">iPhone Price related Dashboard</h1><div id="data-timestamp" class="header-meta">Data loading...</div></div><div class="top-control-row"><div class="card product-card-container"><div class="phone-art"></div></div><div class="card sec-control-panel"><div class="timeline"><div class="timeline-track"></div><div class="timeline-nodes"><div class="timeline-node"><strong>Announcement</strong>9/10</div><div class="timeline-node"><strong>Pre-order</strong>9/12</div><div class="timeline-node"><strong>On shelf</strong>9/19</div></div></div><div class="filter-grid" style="grid-template-columns:repeat(3,minmax(150px,1fr))"><div class="filter-item"><span class="filter-label">NPI Series</span><button class="filter-btn" id="npiDisplay" disabled>iPhone 17 Series</button></div><div class="filter-item"><span class="filter-label">N-1 Series</span><button class="filter-btn" disabled>iPhone 16 Series</button></div><div class="filter-item"><span class="filter-label">Date</span><select id="date"><option value="">All</option><option value="2025-09-10,2025-09-12">9/10～9/12</option></select></div></div></div></div><div class="card section-card"><div class="header-bar"><div><h2 class="section-title" style="margin-bottom:4px">Worries on Price Drop and Price Protection</h2><div class="muted">价格相关咨询占 Customer 比例</div></div><div class="price-summary"><div class="pill">NPI <strong id="avg-npi-price-rate" style="color:#0071e3">--</strong></div><div class="pill">N-1 <strong id="avg-n1-price-rate" style="color:#af52de">--</strong></div></div></div><div class="chart-box" style="height:480px;margin-top:18px"><canvas id="priceTrendChart"></canvas></div></div></div><script>
let priceChart;
const state=VOCDashboardState.read();
function initFilters(){npiDisplay.textContent=state.product||'iPhone 17 Series';if(state.date_from||state.date_to){const value=(state.date_from||'')+','+(state.date_to||'');VOCDashboardState.ensureOption(date,value,[state.date_from,state.date_to].filter(Boolean).join(' ～ '));}}
function filterPatch(){const patch={date_from:'',date_to:''};if(date.value){const p=date.value.split(',');patch.date_from=p[0]||'';patch.date_to=p[1]||p[0]||'';}return patch;}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+Number(b||0),0)/arr.length:0}
async function load(){try{const patch=filterPatch();const q=new URLSearchParams();if(patch.date_from)q.set('date_from',patch.date_from);if(patch.date_to)q.set('date_to',patch.date_to);const r=await fetch('/api/mcp/price_data?'+q);const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'request failed');const d=j.data||{},daily=d.daily||[],s=d.summary||{};const npiRate=Number.isFinite(Number(s.avg_ratio_pct))?Number(s.avg_ratio_pct):avg(daily.map(x=>x.npi_ratio_pct));const n1Rate=Number.isFinite(Number(s.n1_avg_ratio_pct))?Number(s.n1_avg_ratio_pct):avg(daily.map(x=>x.n1_ratio_pct));document.getElementById('avg-npi-price-rate').textContent=npiRate.toFixed(1)+'%';document.getElementById('avg-n1-price-rate').textContent=n1Rate.toFixed(1)+'%';const labels=daily.map(x=>{const p=String(x.date||'').split('-');return p.length===3?`${Number(p[1])}/${Number(p[2])}`:x.date});priceChart?.destroy();priceChart=new Chart(document.getElementById('priceTrendChart'),{type:'bar',data:{labels,datasets:[{label:'NPI',data:daily.map(x=>Number(x.npi_ratio_pct||0)),backgroundColor:'#0071e3',hoverBackgroundColor:'#0077ed',borderRadius:6,barPercentage:.45,categoryPercentage:.65},{label:'N-1',data:daily.map(x=>Number(x.n1_ratio_pct||0)),backgroundColor:'#af52de',hoverBackgroundColor:'#b865e2',borderRadius:6,barPercentage:.45,categoryPercentage:.65}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',align:'end',labels:{usePointStyle:true,pointStyle:'rectRounded'}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${Number(ctx.raw||0).toFixed(2)}%`}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>v+'%'},grid:{color:'rgba(0,0,0,.05)'}}}}});const last=patch.date_to||daily.at(-1)?.date;const meta=last?'Data as of '+String(last).replace(/-/g,'/'):'VOC MCP · live';document.getElementById('data-timestamp').textContent=meta;VOCDashboardState.notifyMeta(meta)}catch(e){const meta='VOC MCP error: '+e.message;document.getElementById('data-timestamp').textContent=meta;VOCDashboardState.notifyMeta(meta)}}
date.onchange=()=>{VOCDashboardState.notify(filterPatch());load()};initFilters();load();
</script></body></html>
