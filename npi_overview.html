<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone NPI Overview</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><link rel="stylesheet" href="./template.css"></head><body><div class="app-container"><div class="header-bar"><h1 class="header-title">iPhone NPI Overview</h1><div id="data-timestamp" class="header-meta">Data loading...</div></div><div class="top-control-row"><div class="card product-card-container"><div class="phone-art"></div></div><div class="card sec-control-panel"><div class="timeline"><div class="timeline-track"></div><div class="timeline-nodes"><div class="timeline-node"><strong>Announcement</strong>9/10</div><div class="timeline-node"><strong>Pre-order</strong>9/12</div><div class="timeline-node"><strong>On shelf</strong>9/19</div></div></div><div class="filter-grid"><div class="filter-item"><span class="filter-label">NPI</span><button class="filter-btn">iPhone 17 Series</button></div><div class="filter-item"><span class="filter-label">N-1</span><button class="filter-btn">iPhone 16 Series</button></div><div class="filter-item"><span class="filter-label">FW</span><select id="fw"><option value="">All</option><option>FY25Q4W11</option></select></div><div class="filter-item"><span class="filter-label">Date</span><select id="date"><option value="">All</option><option value="2025-09-10,2025-09-12">9/10～9/12</option></select></div></div></div></div><div class="sec-kpi-cards"><div class="card kpi-card"><div class="kpi-title">Customer</div><div class="kpi-values"><div class="kpi-col"><div id="kpi-cust-npi" class="kpi-number">--</div><div class="sublabel">NPI</div></div><div class="kpi-col"><div id="kpi-cust-lol" class="kpi-lol">--</div><div class="sublabel">LoL</div></div></div></div><div class="card kpi-card"><div class="kpi-title">Inquiries</div><div class="kpi-values"><div class="kpi-col"><div id="kpi-inq-npi" class="kpi-number">--</div><div class="sublabel">NPI</div></div><div class="kpi-col"><div id="kpi-inq-lol" class="kpi-lol">--</div><div class="sublabel">LoL</div></div></div></div><div class="card kpi-card"><div class="kpi-title">Conversion rate</div><div class="kpi-values"><div class="kpi-col"><div id="kpi-cvr-npi" class="kpi-number">--</div><div class="sublabel">NPI</div></div><div class="kpi-col"><div id="kpi-cvr-lol" class="kpi-lol">--</div><div class="sublabel">LoL</div></div></div></div></div><div class="two-col"><div class="card section-card"><h2 class="section-title">Program</h2><div id="program"></div></div><div class="card section-card"><h2 class="section-title">Feature</h2><div id="feature"></div></div></div><div class="card section-card"><div class="header-bar"><h2 class="section-title">Customer Trend</h2><span class="muted">NPI vs N-1</span></div><div class="chart-box"><canvas id="trendChart"></canvas></div></div></div><script>let chart;const n=v=>Number(String(v??0).replace(/,/g,''));function setLol(id,v){const el=document.getElementById(id);el.textContent=v||'--';const x=parseFloat(v);el.className='kpi-lol '+(x>0?'positive':x<0?'negative':'')}function renderMatrix(id,items,avg){const root=document.getElementById(id);if(!items?.length){root.innerHTML='<div class="muted">暂无数据</div>';return}const max=Math.max(...items.map(x=>Number(x.inquiryPct)||0),1);root.innerHTML='<div class="matrix-grid"><div class="axis-panel">'+items.map(x=>`<div class="axis-item" title="${x.name}">${x.name}</div>`).join('')+'</div><div>'+items.map(x=>`<div class="bar-row"><div style="font-size:11px">${Number(x.inquiryPct||0).toFixed(1)}%</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(Number(x.inquiryPct||0)/max)*100)}%"></div></div></div>`).join('')+'</div><div class="dot-panel">'+items.map(x=>{const p=Math.max(5,Math.min(95,50+(Number(x.cvr||0)-avg)*12));return `<div class="dot-row"><span class="dot" title="CVR ${Number(x.cvr||0).toFixed(1)}%" style="left:${p}%;background:${Number(x.cvr||0)>=avg?'#34c759':'#ff3b30'}"></span></div>`}).join('')+'</div></div>'}async function load(){try{const q=new URLSearchParams();if(fw.value)q.set('fw',fw.value);if(date.value){const[d1,d2]=date.value.split(',');q.set('date_from',d1);q.set('date_to',d2)}const r=await fetch('/api/mcp/overview_data?'+q);const j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'request failed');const d=j.data,k=d.kpis||{};if(k.customers){document.getElementById('kpi-cust-npi').textContent=n(k.customers.npi).toLocaleString();setLol('kpi-cust-lol',k.customers.lol)}if(k.inquiries){document.getElementById('kpi-inq-npi').textContent=n(k.inquiries.npi).toLocaleString();setLol('kpi-inq-lol',k.inquiries.lol)}if(k.cvr){document.getElementById('kpi-cvr-npi').textContent=k.cvr.npi;setLol('kpi-cvr-lol',k.cvr.lol)}const avg=parseFloat(k.cvr?.npi)||0;renderMatrix('program',d.program,avg);renderMatrix('feature',d.feature,avg);if(d.trend?.length){chart?.destroy();chart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:d.trend.map(x=>x.date.replace(/^\d{4}-/,'')),datasets:[{label:'NPI',data:d.trend.map(x=>x.npi),borderColor:'#0071e3',backgroundColor:'rgba(0,113,227,.06)',tension:.35,fill:true},{label:'N-1',data:d.trend.map(x=>x.n1),borderColor:'#8e8e93',borderDash:[4,4],tension:.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{display:false},x:{grid:{display:false}}}}})}document.getElementById('data-timestamp').textContent='Data as of '+(d.date_timestamp||'VOC MCP')}catch(e){document.getElementById('data-timestamp').textContent='VOC MCP error: '+e.message}}fw.onchange=load;date.onchange=load;load();</script></body></html>
