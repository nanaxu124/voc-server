<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone Product Mix</title><link rel="stylesheet" href="./template.css"></head><body><div class="app-container"><div class="dashboard-header"><div class="header-title-box"><h1>iPhone Product Mix</h1></div><div id="data-timestamp" class="header-meta">VOC MCP</div></div><div class="top-control-section"><div class="card product-hero-card"><div class="phone-art"></div><div style="font-weight:700;margin-top:8px">iPhone 17 Series</div></div><div class="card controls-hub-card"><div class="timeline"><div class="timeline-track"></div><div class="timeline-nodes"><div class="timeline-node"><strong>Announcement</strong>9/10</div><div class="timeline-node"><strong>Pre-order</strong>9/12</div><div class="timeline-node"><strong>On shelf</strong>9/19</div></div></div><div class="filter-grid two"><div class="filter-item"><span class="filter-label">FW</span><select id="fw"><option value="">All</option><option>FY25Q4W11</option></select></div><div class="filter-item"><span class="filter-label">Date</span><select id="date"><option value="">All</option><option value="2025-09-10,2025-09-12">9/10～9/12</option></select></div></div></div></div><div class="two-col"><div class="card mix-table-card"><div class="table-head"><div><span class="badge">NPI</span><strong style="margin-left:8px">Product Mix</strong></div><span class="summary" id="npiSummary">--</span></div><table class="data-table"><thead><tr><th>Series</th><th>Sub LOB</th><th style="text-align:right">Customers</th><th style="text-align:right">Share</th></tr></thead><tbody id="npiBody"></tbody></table></div><div class="card mix-table-card"><div class="table-head"><div><span class="badge" style="background:#f0f1f5;color:#6e6e73">N-1</span><strong style="margin-left:8px">Product Mix</strong></div><span class="summary" id="n1Summary">--</span></div><table class="data-table"><thead><tr><th>Series</th><th>Sub LOB</th><th style="text-align:right">Customers</th><th style="text-align:right">Share</th></tr></thead><tbody id="n1Body"></tbody></table></div></div><div class="card section-card"><div class="header-bar"><div><span class="badge">Sub LOB</span><strong style="margin-left:8px">Storage & Color scope</strong></div><span class="muted">由 MCP 结果实时汇总</span></div></div><div class="two-col"><div class="card mix-table-card"><div class="table-head"><strong>Storage Mix</strong><span class="summary" id="storageSummary">--</span></div><table class="data-table"><thead><tr><th>Storage</th><th style="text-align:right">NPI</th><th style="text-align:right">N-1</th><th style="text-align:right">Diff</th></tr></thead><tbody id="storageBody"></tbody></table></div><div class="card mix-table-card"><div class="table-head"><strong>Color Mix</strong><span class="summary" id="colorSummary">--</span></div><table class="data-table"><thead><tr><th>Color</th><th style="text-align:right">NPI</th><th style="text-align:right">N-1</th><th style="text-align:right">Diff</th></tr></thead><tbody id="colorBody"></tbody></table></div></div></div><script>function pct(v,t){return t>0?v/t*100:0}function seriesRows(data){const total=Number(data.grandTotal||0);let html='';Object.entries(data.seriesData||{}).forEach(([series,s])=>{Object.entries(s.subLobs||{}).forEach(([sub,count])=>{html+=`<tr><td><strong>${series}</strong></td><td>${sub}</td><td style="text-align:right">${Number(count).toLocaleString()}</td><td style="text-align:right"><div class="pctbar"><strong>${pct(count,total).toFixed(1)}%</strong><span class="mini-track"><span class="mini-fill" style="display:block;width:${Math.min(100,pct(count,total))}%"></span></span></div></td></tr>`});html+=`<tr><td><strong>${series}</strong></td><td class="muted">小计</td><td style="text-align:right"><strong>${Number(s.total||0).toLocaleString()}</strong></td><td style="text-align:right"><strong>${pct(s.total,total).toFixed(1)}%</strong></td></tr>`});return html}function renderDimension(target,body,summary,npiKey,n1Key,npiTotalKey,n1TotalKey){const keys=[...new Set([...Object.keys(target[npiKey]||{}),...Object.keys(target[n1Key]||{})])];const nt=Number(target.npiOverviewTotal||0),ot=Number(target.n1OverviewTotal||0);body.innerHTML=keys.map(k=>{const a=Number(target[npiKey]?.[k]||0),b=Number(target[n1Key]?.[k]||0),pa=pct(a,nt),pb=pct(b,ot),diff=pa-pb;return `<tr><td><strong>${k}</strong></td><td style="text-align:right">${pa.toFixed(1)}%</td><td style="text-align:right">${pb.toFixed(1)}%</td><td style="text-align:right;color:${diff>0?'#248a3d':diff<0?'#d70015':'#6e6e73'}"><strong>${diff>=0?'+':''}${diff.toFixed(1)} pt</strong></td></tr>`}).join('');summary.textContent=`NPI ${nt.toLocaleString()} / N-1 ${ot.toLocaleString()}`}async function load(){try{const q=new URLSearchParams();if(fw.value)q.set('fw',fw.value);if(date.value){const[d1,d2]=date.value.split(',');q.set('date_from',d1);q.set('date_to',d2)}const r=await fetch('/api/mcp/mix_data?'+q),j=await r.json();if(!r.ok||!j.success)throw new Error(j.error||'request failed');const d=j.data,npi=d.npi_product_mix||{},n1=d.n1_product_mix||{};npiBody.innerHTML=seriesRows(npi);n1Body.innerHTML=seriesRows(n1);npiSummary.textContent=`Total ${Number(npi.grandTotal||0).toLocaleString()}`;n1Summary.textContent=`Total ${Number(n1.grandTotal||0).toLocaleString()}`;renderDimension(d.part4?.storage||{},storageBody,storageSummary,'npiStorage','n1Storage');renderDimension(d.part4?.color||{},colorBody,colorSummary,'npiColor','n1Color');document.getElementById('data-timestamp').textContent='VOC MCP · live'}catch(e){document.getElementById('data-timestamp').textContent='VOC MCP error: '+e.message}}fw.onchange=load;date.onchange=load;load();</script></body></html>
