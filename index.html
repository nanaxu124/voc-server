<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPI VOC Dashboard</title><link rel="stylesheet" href="styles.css"><script src="mcp_client.js"></script></head><body><header class="top"><div class="brand">NPI VOC Dashboard</div><div class="controls"><select id="npi" class="select"></select><select id="product" class="select"></select></div><div class="actions"><span id="mcp" class="pill"><span class="dot"></span><span id="mcp-text">VOC MCP</span></span><button id="ask" class="btn primary">AI 问答</button></div></header><nav id="tabs" class="nav"></nav><iframe id="frame" class="frame" title="dashboard"></iframe><aside id="drawer" class="drawer"><div class="drawer-head"><div><b>VOC 智能分析助手</b><div class="sub">回答基于服务端 MCP 实时数据</div></div><button id="close-chat" class="btn">关闭</button></div><div id="messages" class="drawer-body"><div class="msg">可以询问 KPI、意图、价格、产品 Mix。服务端会先取 VOC MCP 数据，再交给配置的大模型分析。</div></div><div class="drawer-foot"><div class="chat-row"><select id="model" class="select"><option value="endor-deepseek-v3.2">DeepSeek V3.2</option><option value="endor-minimax-m2.5">MiniMax M2.5</option><option value="gemini-2.5-flash">Gemini 2.5 Flash</option></select><input id="question" class="input" placeholder="输入问题"><button id="send" class="btn primary">发送</button></div></div></aside><script src="app.js"></script></body></html>
