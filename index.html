<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPI Dashboard</title><link rel="stylesheet" href="./template.css"><style>html,body{height:100%;padding:0}.shell{height:100%;display:flex;flex-direction:column}.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 40px;background:#f8f9fa;border-bottom:1px solid #eaeaea}.dropdown-group{display:flex;gap:24px}.top-select{border:0;background:transparent;font-weight:600;font-size:14px}.nav-container{display:flex;justify-content:center;padding:20px 40px}.tabs{display:inline-flex;background:#fff;border-radius:50px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.tab-btn{border:0;background:transparent;padding:10px 24px;color:#666;font-weight:600;font-size:15px;border-radius:50px;cursor:pointer}.tab-btn.active{background:linear-gradient(90deg,#4b9fff,#5dc4ff);color:#fff;box-shadow:0 4px 10px rgba(75,159,255,.3)}iframe{width:100%;flex:1;border:0;display:block}.ai-bubble{position:fixed;right:28px;bottom:28px;padding:12px 18px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#0071e3,#af52de,#ff2d55);font-weight:700;box-shadow:0 10px 26px rgba(175,82,222,.35);cursor:pointer;z-index:20}.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;background:#fff;border-left:1px solid #e5e5ea;box-shadow:-10px 0 40px rgba(0,0,0,.09);transform:translateX(100%);transition:.25s;z-index:30;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.drawer-head{padding:16px 18px;border-bottom:1px solid #e5e5ea;display:flex;justify-content:space-between}.messages{flex:1;overflow:auto;padding:16px}.input-row{display:flex;gap:8px;padding:14px;border-top:1px solid #e5e5ea}.input-row input{flex:1;border:1px solid #d1d1d6;border-radius:20px;padding:10px 14px}.msg{padding:10px 12px;border-radius:12px;margin-bottom:10px;background:#f7f8fa;font-size:13px}.msg.user{background:#0071e3;color:#fff;margin-left:60px}</style></head><body><div class="shell"><div class="top-bar"><div class="dropdown-group"><select class="top-select" id="npiSelect"><option>FY25 Fall NPI</option><option>FY26 Spring NPI</option></select><select class="top-select" id="productSelect"><option>iPhone 17 Series</option><option>Watch Series</option><option>MacBook Pro M5</option><option>iPad Pro M5</option></select></div><div id="dataDate" class="muted">Data loading...</div></div><div class="nav-container"><div class="tabs" id="tabs"></div></div><iframe id="dashboardFrame"></iframe></div><div class="ai-bubble" onclick="toggleAI()">AI 智能问答 · VOC</div><aside class="drawer" id="drawer"><div class="drawer-head"><strong>VOC 智能分析助手</strong><button onclick="toggleAI()">×</button></div><div class="messages" id="messages"><div class="msg">可基于当前 VOC MCP 数据进行分析。</div></div><div class="input-row"><input id="aiInput" placeholder="提问当前 NPI VOC 数据..." onkeydown="if(event.key==='Enter')sendAI()"><button onclick="sendAI()">发送</button></div></aside><script>const pages={"Overview":"npi_overview.html","Intent details":"npi_intent_details.html","Product mix":"npi_product_mix.html","Price related":"npi_price_related.html"};let current='Intent details';function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';Object.keys(pages).forEach(name=>{const b=document.createElement('button');b.className='tab-btn'+(name===current?' active':'');b.textContent=name;b.onclick=()=>{current=name;renderTabs();loadPage()};t.appendChild(b)})}function loadPage(){const f=document.getElementById('dashboardFrame');f.src=pages[current];document.getElementById('dataDate').textContent='Data loading...';f.onload=()=>{try{const el=f.contentDocument.getElementById('data-timestamp');document.getElementById('dataDate').textContent=el?.textContent||'VOC MCP'}catch(e){document.getElementById('dataDate').textContent='VOC MCP'}}}function toggleAI(){document.getElementById('drawer').classList.toggle('show')}function append(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;document.getElementById('messages').appendChild(d)}async function sendAI(){const i=document.getElementById('aiInput');const q=i.value.trim();if(!q)return;append('user',q);i.value='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,model:'gemini-2.5-flash'})});const j=await r.json();append('',j.answer||j.error||'No response')}catch(e){append('','请求失败：'+e.message)}}renderTabs();loadPage();</script></body></html>
